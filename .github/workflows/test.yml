name: Tests

# Every test that gates a pull request into develop, as one workflow with a job per kind:
#   pytest      the Python tests (api/tests) on a real model; the model is downloaded once into a
#               cached HF_HOME, so every run uses the same checkpoint as a local run
#   quickstart  the README's start command, run literally, must come up without a model
#   gradle      the Kotlin client's common tests on the JVM, and the web (Wasm) target compiles
#   web-bundle  rebuilds the web client from app/; on develop it commits api/src/main/webpack when it differs
#   native-desktop  builds the GraalVM native executable on Windows x64 (:app:nativeDist) and checks
#               that it opens its window, takes clicks and keys, and streams a chat reply from the server
#               on SmolLM2-135M-Instruct (SPEC S3.4, #191; owner approval 2026-11-13)
# The torchnative run is test-torchnative.yml (different triggers, non-blocking).
on:
  # Checked on develop after merging, not on every pull request (user decision,
  # 2026-10-17). A red develop is fixed forward by its own pull request.
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      GEMSTONE_TEST_MODEL: HuggingFaceTB/SmolLM2-135M
      GEMSTONE_TEST_ALLOW_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          # The upstream PyTorch baseline stays on 3.13; torchnative runs on 3.15t in
          # test-torchnative.yml (#177).
          python-version: "3.13"

      - name: Cache the Hugging Face model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ env.GEMSTONE_TEST_MODEL }}-v1

      - name: Install (upstream PyTorch, CPU)
        run: uv sync --locked --extra torch  # exactly uv.lock (#186)

      - name: Test
        run: uv run --extra torch pytest -v -m "real_model or not real_model"

  quickstart:
    # The documented start command, run literally, must come up without a model and answer.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install (as in the README)
        run: uv sync --locked --python 3.13 --extra torch  # the README command, held to uv.lock (#186)

      - name: Start the server and ask for its version
        run: |
          uv run --extra torch python -m api run server > server.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:23100/api/version; then ok=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill -INT "$pid" 2>/dev/null || true
          wait "$pid" || true
          cat server.log
          test "$ok" = 1

  gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Common tests on the JVM
        run: ./gradlew :app:desktopTest --console=plain

      - name: Compile the web target
        run: ./gradlew :app:compileKotlinWasmJs --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: app/build/test-results/desktopTest/
          if-no-files-found: ignore

  native-desktop:
    # SPEC S3.4 / #191: the desktop target as a GraalVM native image, Windows x64 only so far
    # (docs/build/native-desktop.md). Added with the owner's approval of 2026-11-13.
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4

      # The Gradle daemon runs on JDK 21 (gradle/gradle-daemon-jvm.properties); nativeCompile uses
      # the JDK 22 toolchain (nativeImageJdk in app/build.gradle.kts), which must be a GraalVM:
      # auto-download is off so no plain JDK 22 is provisioned in its place.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: "22"

      - uses: gradle/actions/setup-gradle@v4

      - name: Point Gradle at the installed JDKs
        shell: pwsh
        run: |
          # setup-gradle moves GRADLE_USER_HOME off the home directory; that is where Gradle reads it.
          $props = Join-Path ($env:GRADLE_USER_HOME ?? "$HOME/.gradle") "gradle.properties"
          New-Item -ItemType Directory -Force (Split-Path $props) | Out-Null
          @(
            "org.gradle.java.installations.auto-detect=false"
            "org.gradle.java.installations.auto-download=false"
            "org.gradle.java.installations.paths=$($env:JAVA_HOME_21_X64 -replace '\\','/'),$($env:GRAALVM_HOME -replace '\\','/')"
          ) | Add-Content $props
          Get-Content $props

      - name: Build the native executable
        run: ./gradlew :app:nativeDist --console=plain

      # The chat check (#191) talks to the real server on SmolLM2-135M-Instruct, the smallest model the
      # server maps (smollm2:135m), fetched once into a cached HF_HOME. The model download in CI was
      # approved by the leader on 2026-11-13 ("#191 Windows CI steps are approved").
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Cache the Hugging Face model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-windows-HuggingFaceTB/SmolLM2-135M-Instruct-v1

      - name: Install the server (upstream PyTorch, CPU)
        run: uv sync --locked --python 3.13 --extra torch  # exactly uv.lock (#186)

      - name: Fetch SmolLM2-135M-Instruct through the server
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-smoke | Out-Null
          $s = Start-Process -FilePath .venv/Scripts/python.exe -ArgumentList "-m", "api", "run", "server" -PassThru `
            -RedirectStandardOutput native-smoke/pull-server.log -RedirectStandardError native-smoke/pull-server.err.log
          $up = $false
          for ($i = 0; $i -lt 120 -and -not $s.HasExited; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:23100/api/version | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          $ok = $false
          if ($up) {
            $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:23100/api/pull -ContentType application/json `
              -Body '{"model": "smollm2:135m", "stream": false}' -TimeoutSec 900
            Write-Output "pull: $($r | ConvertTo-Json -Compress)"
            $ok = $r.status -eq "success"
          }
          if (-not $s.HasExited) { taskkill /T /F /PID $s.Id | Out-Null }
          Get-Content native-smoke/pull-server.err.log -Tail 40
          if (-not $ok) { Write-Output "the server did not come up or the pull failed"; exit 1 }

      - name: Start it, check input, and stream a chat reply
        shell: pwsh
        run: |
          $exe = "app/build/dist/bin/gemstone.exe"
          if (-not (Test-Path $exe)) { Write-Output "missing $exe"; exit 1 }
          "{0:N1} MB  $exe" -f ((Get-Item $exe).Length / 1MB)
          New-Item -ItemType Directory -Force native-smoke | Out-Null
          # Offline from here on: a wrong model selection (the default, Qwen3-0.6B) fails instead of
          # downloading 1.2 GB.
          $env:HF_HUB_OFFLINE = "1"
          $srv = Start-Process -FilePath .venv/Scripts/python.exe -ArgumentList "-m", "api", "run", "server" -PassThru `
            -RedirectStandardOutput native-smoke/server.log -RedirectStandardError native-smoke/server.err.log
          $up = $false
          for ($i = 0; $i -lt 120 -and -not $srv.HasExited; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:23100/api/version | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          Write-Output "server up: $up"
          Write-Output "models: $((Invoke-RestMethod http://127.0.0.1:23100/api/models) | ConvertTo-Json -Compress)"
          $chats = Join-Path $env:APPDATA "Gemstone/chats.json"
          if (Test-Path $chats) { Remove-Item $chats }
          $p = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardOutput native-smoke/stdout.log -RedirectStandardError native-smoke/stderr.log
          $deadline = (Get-Date).AddSeconds(120)
          $title = ""
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
            $p.Refresh()
            if ($p.MainWindowTitle -like "*Gemstone AI*") { $title = $p.MainWindowTitle; break }
            Start-Sleep -Seconds 1
          }
          # A window that appears and then dies (missing metadata on first composition) is a failure too.
          if ($title) { Start-Sleep -Seconds 15 }
          $alive = -not $p.HasExited
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("native-smoke/screen.png")
          # Input (#191): text typed before the click must not appear (the field has no focus yet); after a
          # click on the chat input field, typed text must appear in that row and nothing else may change.
          $inputOk = $false
          $reply = ""
          if ($alive) {
            Add-Type @"
          using System; using System.Runtime.InteropServices;
          public class Win {
              [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L,T,R,B; }
              [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
              [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
              [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
              [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, IntPtr e);
          }
          "@
            [Win]::SetProcessDPIAware() | Out-Null
            [Win]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 1
            $r = New-Object Win+RECT
            [Win]::GetWindowRect($p.MainWindowHandle, [ref]$r) | Out-Null
            Write-Output "window rect: $($r.L),$($r.T) - $($r.R),$($r.B)"
            function Shot($path) {
              $w = $r.R - $r.L; $h = $r.B - $r.T
              $bm = New-Object System.Drawing.Bitmap $w, $h
              [System.Drawing.Graphics]::FromImage($bm).CopyFromScreen($r.L, $r.T, 0, 0, $bm.Size)
              $bm.Save($path); return $bm
            }
            function Changed($a, $b) {
              $inRow = 0; $other = 0
              for ($yy = 0; $yy -lt $a.Height; $yy += 2) { for ($xx = 0; $xx -lt $a.Width; $xx += 2) {
                if ($a.GetPixel($xx, $yy).ToArgb() -ne $b.GetPixel($xx, $yy).ToArgb()) {
                  if ($yy -ge $a.Height - 90) { $inRow++ } else { $other++ }
                }
              } }
              return @($inRow, $other)
            }
            function Click($x, $y) {
              foreach ($fx in @(0.3, 0.5, 0.7)) { [Win]::SetCursorPos($r.L + [int](($r.R - $r.L) * $fx), $r.T + [int](($r.B - $r.T) / 2)) | Out-Null; Start-Sleep -Milliseconds 200 }
              [Win]::SetCursorPos($x, $y) | Out-Null; Start-Sleep -Milliseconds 300
              [Win]::mouse_event(0x0002, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Milliseconds 90
              [Win]::mouse_event(0x0004, 0, 0, 0, [IntPtr]::Zero); Start-Sleep -Seconds 1
            }
            $before = Shot "native-smoke/before-input.png"
            [System.Windows.Forms.SendKeys]::SendWait("unfocused")
            Start-Sleep -Seconds 2
            $unfocused = Shot "native-smoke/typed-before-click.png"
            $c0 = Changed $before $unfocused
            Write-Output "typed before any click: changed pixels (sampled 1 in 4): input row $($c0[0]), rest $($c0[1])"
            # The model chips run along the sidebar ("All", "Qwen 3", then the local models); the third
            # chip, HuggingFaceTB/SmolLM2-135M-Instruct, starts about 165 px from the window's left edge.
            Click ($r.L + 240) ($r.T + 183)
            # The row then scrolls the selected chip into view, and the chip keeps its hover shadow until
            # the pointer leaves it: move the pointer to the empty chat area and let both settle before the
            # next baseline (run 43363256128 counted that shadow as a change outside the input row).
            [Win]::SetCursorPos($r.L + [int](($r.R - $r.L) * 0.6), $r.T + [int](($r.B - $r.T) * 0.45)) | Out-Null
            Start-Sleep -Seconds 4
            $selected = Shot "native-smoke/model-selected.png"
            # The input field spans the bottom of the chat pane, about 40 px above the window's bottom edge.
            $x = $r.L + [int](($r.R - $r.L) * 0.6); $y = $r.B - 45
            Click $x $y
            [System.Windows.Forms.SendKeys]::SendWait("native input check")
            Start-Sleep -Seconds 2
            $after = Shot "native-smoke/after-input.png"
            $c1 = Changed $selected $after
            Write-Output "clicked ($x,$y), typed 'native input check': changed pixels (sampled 1 in 4): input row $($c1[0]), rest $($c1[1])"
            # Run 43309886148 measured 172 in the input row and 0 elsewhere for this text.
            $inputOk = ($c0[0] -eq 0) -and ($c1[0] -ge 50) -and ($c1[1] -eq 0)
            # Chat (#191): send it with the round button at the input row's right end and wait for the
            # reply; the app saves a chat once its first reply completes (SPEC S2.6).
            Click ($r.R - 47) ($r.B - 48)
            $deadline = (Get-Date).AddSeconds(300)
            while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
              if (Test-Path $chats) {
                try {
                  $turn = ((Get-Content $chats -Raw | ConvertFrom-Json).chats | Select-Object -First 1).turns | Select-Object -Last 1
                  if ($turn.user -eq "native input check" -and $turn.assistant) { $reply = $turn.assistant; break }
                } catch { }
              }
              Start-Sleep -Seconds 2
            }
            Start-Sleep -Seconds 2
            Shot "native-smoke/reply.png" | Out-Null
            Write-Output "reply: '$reply'"
            Write-Output "resident models: $((Invoke-RestMethod http://127.0.0.1:23100/api/ps) | ConvertTo-Json -Compress -Depth 4)"
          }
          if ($alive) { $p.CloseMainWindow() | Out-Null; if (-not $p.WaitForExit(30000)) { $p.Kill() } }
          if (-not $srv.HasExited) { taskkill /T /F /PID $srv.Id | Out-Null }
          if (Test-Path $chats) { Copy-Item $chats native-smoke/chats.json }
          Write-Output "window title: '$title'  alive after 15 s: $alive  exit code: $(if ($p.HasExited) { $p.ExitCode })"
          Write-Output "--- stdout"; Get-Content native-smoke/stdout.log -Tail 40
          Write-Output "--- stderr"; Get-Content native-smoke/stderr.log -Tail 40
          Write-Output "--- server"; Get-Content native-smoke/server.err.log -Tail 60
          if (-not $title -or -not $alive) { exit 1 }
          if (-not $inputOk) { Write-Output "input check failed: typing before the click must change nothing, and after the click it must show in the input row only"; exit 1 }
          if (-not $reply) { Write-Output "chat check failed: no reply to 'native input check' was saved within 300 s"; exit 1 }

      - name: Upload the start-up logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-desktop-smoke
          path: native-smoke/
          if-no-files-found: ignore

  web-bundle:
    # The server serves the committed Wasm build in api/src/main/webpack, so a git clone works without a
    # JDK. A local build never matches this Linux build byte for byte (#196), so this job commits the
    # bundle itself: on a develop push it commits a differing build to develop (#197); elsewhere it only
    # reports the difference.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # the bundle commit on develop
      actions: write   # starting release-sync for that commit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the web client
        run: ./gradlew :app:wasmJsBrowserDistribution --console=plain

      - name: Copy it over the committed bundle
        run: tools/sync-web-bundle.sh

      - name: Upload the fresh bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: api/src/main/webpack/

      - name: Commit the bundle on develop, report it elsewhere
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A api/src/main/webpack
          if git diff --cached --quiet -- api/src/main/webpack; then
            echo "The committed web bundle is current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat -- api/src/main/webpack
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::notice::api/src/main/webpack differs from this build. The develop run commits it; do not commit a locally built bundle."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Chore: Rebuild the web bundle from app/ [skip ci]" \
            -m "Built by the web-bundle job of run $GITHUB_RUN_ID from $GITHUB_SHA (#197)."
          if ! git push origin HEAD:refs/heads/develop; then
            # develop moved while this ran; the newer commit's own run rebuilds from newer source
            echo "::notice::develop moved on; the bundle is left to the newer commit's run."
            exit 0
          fi
          echo "Committed the rebuilt web bundle to develop: $(git rev-parse --short HEAD)." >> "$GITHUB_STEP_SUMMARY"
          # A push made with GITHUB_TOKEN starts no workflow, so release-sync is started here
          gh workflow run release-sync.yml --ref develop \
            || echo "::warning::Could not start release-sync; release lags until the next develop push."

