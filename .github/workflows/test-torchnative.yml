name: Tests on torchnative

# The same api/tests as test.yml (job pytest), on torchnative instead of upstream PyTorch (SPEC S1.11,
# AGENTS 12). Non-blocking: it is neither a required check nor run on pull requests until
# torchnative is ready. Tests that need a capability the installed torchnative lacks (continuous
# batching, q8_0) skip with a reason naming it; `-rs` prints every skip reason. Nothing skips on
# upstream PyTorch.
on:
  workflow_dispatch:
    inputs:
      torchnative:
        description: "torchnative version spec, e.g. 0.1.0b4 or >=0.1.0b4 (empty: the latest pre-release)"
        required: false
        default: ""
      wheel_url:
        description: "URL of a torchnative wheel (manylinux x86_64; cp315t for 3.15t, abi3 for a GIL build) to install instead of PyPI"
        required: false
        default: ""
      python:
        description: "Python to run on (3.15t is the standard interpreter for torchnative; 3.13 for a GIL comparison)"
        required: false
        default: "3.15t"
  schedule:
    - cron: "0 5 * * 1"  # weekly, Monday 05:00 UTC
  # workflow_dispatch and schedule only fire once this file is on the default branch (main), which
  # develop reaches through the release PR. Until then, push to ci/torchnative to run it on demand
  # (e.g. git push origin develop:ci/torchnative).
  push:
    branches: [ci/torchnative]

permissions:
  contents: read

concurrency:
  group: test-torchnative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      GEMSTONE_TEST_MODEL: HuggingFaceTB/SmolLM2-135M
      GEMSTONE_TEST_ALLOW_DOWNLOAD: "1"
      TORCHNATIVE_SPEC: ${{ inputs.torchnative }}
      # For a push run on ci/torchnative (no inputs), put the wheel URL in the quotes below in a commit
      # on that branch only; develop keeps it empty.
      TORCHNATIVE_WHEEL_URL: ${{ inputs.wheel_url || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          # Free-threaded CPython 3.15t is the standard interpreter for torchnative (#177); the
          # upstream PyTorch comparison (test.yml) stays on 3.13.
          python-version: ${{ inputs.python || '3.15t' }}

      - name: Cache the Hugging Face model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ env.GEMSTONE_TEST_MODEL }}-v1

      - name: Install (torchnative)
        # torchnative ships cp315t wheels (free-threaded) and abi3 wheels (GIL builds 3.13+) from
        # 0.1.0b6; an abi3 wheel does not install on 3.15t. It is a pre-release:
        # pyproject sets `prerelease = "if-necessary"`, and a pinned spec with a pre-release
        # version allows it too.
        run: |
          if [ -n "$TORCHNATIVE_WHEEL_URL" ]; then
            uv sync --extra torchnative
            curl -fsSL -o "$RUNNER_TEMP/$(basename "$TORCHNATIVE_WHEEL_URL")" "$TORCHNATIVE_WHEEL_URL"
            uv pip install --prerelease=allow --reinstall-package torchnative "$RUNNER_TEMP/$(basename "$TORCHNATIVE_WHEEL_URL")"
          elif [ -n "$TORCHNATIVE_SPEC" ]; then
            case "$TORCHNATIVE_SPEC" in
              [0-9]*) spec="torchnative==$TORCHNATIVE_SPEC" ;;
              *) spec="torchnative$TORCHNATIVE_SPEC" ;;
            esac
            uv sync --extra torchnative --upgrade-package torchnative
            uv pip install --prerelease=allow "$spec"
          else
            uv sync --extra torchnative --upgrade-package torchnative
          fi
          uv run --no-sync python -c "import importlib.metadata as m, sys, torch; print('torchnative', m.version('torchnative'), 'torch', torch.__version__, 'python', sys.version, 'GIL', getattr(sys, '_is_gil_enabled', lambda: True)())"

      - name: Test
        run: uv run --no-sync pytest -v -m "real_model or not real_model" -rs
