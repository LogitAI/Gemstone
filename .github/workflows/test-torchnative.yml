name: Tests on torchnative

# The same api/tests as test.yml (job pytest), on torchnative instead of upstream PyTorch (SPEC S1.11,
# AGENTS 12). Non-blocking: it is neither a required check nor run on pull requests until
# torchnative is ready. Tests that need a capability the installed torchnative lacks (continuous
# batching, q8_0) skip with a reason naming it; `-rs` prints every skip reason. Nothing skips on
# upstream PyTorch.
on:
  # Development runs are started by hand only (owner, 2026-11-14: "개발 테스트 ci는
  # 명시적으로 실행하기").
  workflow_dispatch:
    inputs:
      torchnative:
        description: "torchnative version spec, e.g. 0.1.0b4 or >=0.1.0b4 (empty: the latest pre-release)"
        required: false
        default: ""
      wheel_url:
        description: "URL of a torchnative wheel (manylinux x86_64; cp315t for 3.15t, abi3 for a GIL build) to install instead of PyPI"
        required: false
        default: ""
      python:
        description: "Python to run on (3.15t is the standard interpreter for torchnative; 3.13 for a GIL comparison)"
        required: false
        default: "3.15t"
      measure:
        description: "Run benchmarks/batching_throughput.py (1/2/4 concurrent requests) and benchmarks/batching_breakdown.py (forward / manager / engine, two A/B rounds), torchnative vs upstream torch, for #74"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # One development run per repository: a run in progress finishes, and a newer dispatch replaces
  # the waiting one (owner, 2026-11-14: "제일 최신꺼만 도는게 맞지").
  group: dev-ci
  cancel-in-progress: false

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      GEMSTONE_TEST_MODEL: HuggingFaceTB/SmolLM2-135M
      GEMSTONE_TEST_ALLOW_DOWNLOAD: "1"
      TORCHNATIVE_SPEC: ${{ inputs.torchnative }}
      # For a push run on ci/torchnative (no inputs), put the wheel URL in the quotes below in a commit
      # on that branch only; develop keeps it empty.
      TORCHNATIVE_WHEEL_URL: ${{ inputs.wheel_url || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          # Free-threaded CPython 3.15t is the standard interpreter for torchnative (#177); the
          # upstream PyTorch comparison (test.yml) stays on 3.13.
          python-version: ${{ inputs.python || '3.15t' }}
          # Some native dependencies have no cp315t wheel yet and are built from source here, and
          # only here (#178): tokenizers and hf-xet (Rust), psutil and pyyaml (C). uv keeps the
          # wheels it built in its cache, and setup-uv's end-of-job prune keeps exactly those, so a
          # run rebuilds only when pyproject.toml or the interpreter changes. Remove once every one
          # of them ships a cp315t wheel.
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: py${{ inputs.python || '3.15t' }}

      - name: Cache the Hugging Face model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-${{ env.GEMSTONE_TEST_MODEL }}-v1

      - name: Install (torchnative)
        # torchnative ships cp315t wheels (free-threaded) and abi3 wheels (GIL builds 3.13+) from
        # 0.1.0b6; an abi3 wheel does not install on 3.15t. It is a pre-release:
        # pyproject sets `prerelease = "if-necessary"`, and a pinned spec with a pre-release
        # version allows it too.
        run: |
          exec > >(tee "$RUNNER_TEMP/install.log") 2>&1  # read by the source-build report below
          if [ -n "$TORCHNATIVE_WHEEL_URL" ]; then
            uv sync --extra torchnative
            curl -fsSL -o "$RUNNER_TEMP/$(basename "$TORCHNATIVE_WHEEL_URL")" "$TORCHNATIVE_WHEEL_URL"
            uv pip install --prerelease=allow --reinstall-package torchnative "$RUNNER_TEMP/$(basename "$TORCHNATIVE_WHEEL_URL")"
          elif [ -n "$TORCHNATIVE_SPEC" ]; then
            case "$TORCHNATIVE_SPEC" in
              [0-9]*) spec="torchnative==$TORCHNATIVE_SPEC" ;;
              *) spec="torchnative$TORCHNATIVE_SPEC" ;;
            esac
            uv sync --extra torchnative --upgrade-package torchnative
            uv pip install --prerelease=allow "$spec"
          else
            uv sync --extra torchnative --upgrade-package torchnative
          fi
          uv run --no-sync python -c "import importlib.metadata as m, sys, torch; print('torchnative', m.version('torchnative'), 'torch', torch.__version__, 'python', sys.version, 'GIL', getattr(sys, '_is_gil_enabled', lambda: True)())"

      - name: Report source builds (#178)
        if: always()
        run: |
          {
            echo "### Packages built from source (#178)"
            echo
            echo "Built in this run:"
            grep -E "^ *Built " "$RUNNER_TEMP/install.log" || echo "none (all from wheels or the uv cache)"
            echo
            echo "Source-built wheels kept in the uv cache:"
            ls "$(uv cache dir)"/sdists-v*/pypi 2>/dev/null || echo "none"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Test
        id: test
        run: uv run --no-sync pytest -v -m "real_model or not real_model" -rs

      - name: Measure batching throughput (#74)
        if: ${{ !cancelled() && inputs.measure }}
        run: |
          mkdir -p "$RUNNER_TEMP/bench-74"
          cpu_model=$(grep -m1 "model name" /proc/cpuinfo 2>/dev/null | cut -d: -f2 | xargs || echo "unknown")
          {
            echo "### Batching throughput baseline (#74)"
            echo
            echo "- run_id: ${{ github.run_id }}"
            echo "- test_outcome: ${{ steps.test.outcome }}"
            echo "- commit: ${{ github.sha }}"
            echo "- runner: ${ImageOS:-unknown} / ${ImageVersion:-unknown}"
            echo "- cpu: $cpu_model"
            echo
            echo "#### torchnative"
            echo '```'
            for c in 1 2 4; do
              uv run --no-sync python benchmarks/batching_throughput.py --concurrency "$c" --tokens 64 --attn sdpa_paged --json "$RUNNER_TEMP/bench-74/torchnative-c${c}.json"
            done
            echo '```'
            echo
            echo "#### upstream PyTorch (3.13, CPU)"
            echo '```'
            uv venv --python 3.13 "$RUNNER_TEMP/upstream-venv"
            UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/upstream-venv" uv sync --locked --python 3.13 --extra torch
            for c in 1 2 4; do
              UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/upstream-venv" uv run --no-sync python benchmarks/batching_throughput.py --concurrency "$c" --tokens 64 --attn sdpa_paged --json "$RUNNER_TEMP/bench-74/upstream-c${c}.json"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          python3 - << 'EOF'
          import json, os
          temp = os.environ["RUNNER_TEMP"]
          dir_path = os.path.join(temp, "bench-74")
          data = {
              "run_id": "${{ github.run_id }}",
              "test_outcome": "${{ steps.test.outcome }}",
              "commit": "${{ github.sha }}",
              "image_os": os.environ.get("ImageOS", "unknown"),
              "image_version": os.environ.get("ImageVersion", "unknown"),
              "cpu_model": os.popen("grep -m1 'model name' /proc/cpuinfo 2>/dev/null | cut -d: -f2 | xargs").read().strip() or "unknown",
              "runs": {}
          }
          for fname in sorted(os.listdir(dir_path)):
              if fname.endswith(".json") and fname not in ("batching-throughput.json", "batching-breakdown.json"):
                  fpath = os.path.join(dir_path, fname)
                  with open(fpath, "r", encoding="utf-8") as f:
                      data["runs"][fname[:-5]] = json.load(f)
          with open(os.path.join(dir_path, "batching-throughput.json"), "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          EOF

      - name: Measure batching breakdown (#74)
        # Where a decode step's time goes (docs/serving/engine.md 7.2): the raw forward, transformers'
        # manager driven step by step, and the engine, with the top operators of one step. Two rounds,
        # torchnative and upstream alternated, so a drift of the runner shows up as a difference
        # between rounds rather than between substrates.
        if: ${{ !cancelled() && inputs.measure }}
        run: |
          mkdir -p "$RUNNER_TEMP/bench-74/breakdown"
          if [ ! -x "$RUNNER_TEMP/upstream-venv/bin/python" ]; then
            uv venv --python 3.13 "$RUNNER_TEMP/upstream-venv"
            UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/upstream-venv" uv sync --locked --python 3.13 --extra torch
          fi
          {
            echo "### Batching breakdown (#74): forward / manager / engine"
            echo
            echo "- run_id: ${{ github.run_id }}"
            echo "- commit: ${{ github.sha }}"
            echo
            for round in 1 2; do
              echo "#### round $round, torchnative"
              echo '```'
              uv run --no-sync python benchmarks/batching_breakdown.py --tokens 64 --attn sdpa_paged --round "$round" --json "$RUNNER_TEMP/bench-74/breakdown/torchnative-r${round}.json"
              echo '```'
              echo
              echo "#### round $round, upstream PyTorch (3.13, CPU)"
              echo '```'
              UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/upstream-venv" uv run --no-sync python benchmarks/batching_breakdown.py --tokens 64 --attn sdpa_paged --round "$round" --json "$RUNNER_TEMP/bench-74/breakdown/upstream-r${round}.json"
              echo '```'
              echo
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

          python3 - << 'EOF'
          import json, os
          temp = os.environ["RUNNER_TEMP"]
          dir_path = os.path.join(temp, "bench-74", "breakdown")
          data = {
              "run_id": "${{ github.run_id }}",
              "test_outcome": "${{ steps.test.outcome }}",
              "commit": "${{ github.sha }}",
              "image_os": os.environ.get("ImageOS", "unknown"),
              "image_version": os.environ.get("ImageVersion", "unknown"),
              "cpu_model": os.popen("grep -m1 'model name' /proc/cpuinfo 2>/dev/null | cut -d: -f2 | xargs").read().strip() or "unknown",
              "order": ["torchnative-r1", "upstream-r1", "torchnative-r2", "upstream-r2"],
              "runs": {}
          }
          for fname in sorted(os.listdir(dir_path)):
              if fname.endswith(".json"):
                  with open(os.path.join(dir_path, fname), "r", encoding="utf-8") as f:
                      data["runs"][fname[:-5]] = json.load(f)
          with open(os.path.join(temp, "bench-74", "batching-breakdown.json"), "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          EOF

      - name: Upload batching throughput and breakdown artifact (#74)
        if: ${{ !cancelled() && inputs.measure }}
        uses: actions/upload-artifact@v4
        with:
          name: batching-throughput-baseline-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bench-74/batching-throughput.json
            ${{ runner.temp }}/bench-74/batching-breakdown.json
          if-no-files-found: error
