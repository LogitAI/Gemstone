name: App tests

# Runs the Kotlin client's common tests on the JVM and compiles the web (Wasm) target, so client
# changes are verified on every pull request instead of only on a developer machine.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Common tests on the JVM
        run: ./gradlew :app:desktopTest --console=plain

      - name: Compile the web target
        run: ./gradlew :app:compileKotlinWasmJs --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: app/build/test-results/desktopTest/
          if-no-files-found: ignore

  web-bundle:
    # The server serves the committed Wasm build in api/src/main/webpack. Rebuild it from app/ and fail
    # when the committed copy is out of date; the fresh build is uploaded so it can be committed.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the web client
        run: ./gradlew :app:wasmJsBrowserDistribution --console=plain

      - name: Copy it over the committed bundle
        run: tools/sync-web-bundle.sh

      - name: Upload the fresh bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: api/src/main/webpack/

      - name: Fail if the committed bundle is out of date
        run: |
          git add -A api/src/main/webpack
          if ! git diff --cached --quiet -- api/src/main/webpack; then
            git diff --cached --stat -- api/src/main/webpack
            echo "::error::api/src/main/webpack is out of date. Run ./gradlew :app:wasmJsBrowserDistribution && tools/sync-web-bundle.sh, or commit the web-bundle artifact of this run."
            exit 1
          fi
